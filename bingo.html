<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanksgiving Bingo Caller</title><style>
*{box-sizing:border-box}body{margin:0;background:#211711;color:#fff4df;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}a{color:#ffcf85}h1{font-size:clamp(28px,5vw,48px);margin:12px 0}p{color:#e6c5a2}button{font:inherit;cursor:pointer;border:1px solid #a97948;background:#493020;color:#fff4df;border-radius:12px;padding:12px 20px;font-weight:700}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ffd77e;outline-offset:3px}.current{background:radial-gradient(ellipse at top,#754123,#39251a);border:1px solid #a97948;border-radius:22px;text-align:center;padding:20px;min-height:280px;display:grid;place-items:center;gap:5px}.letter{font-size:clamp(46px,9vw,82px);font-weight:900;line-height:1}.picture{font-size:clamp(65px,15vw,125px);line-height:1.3}.word{font-size:clamp(25px,5vw,48px);font-weight:800}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}.roll{background:#df812c;color:#201309;border-color:#ffb864;font-size:24px;min-width:200px}.status{text-align:center;font-variant-numeric:tabular-nums}progress{width:100%;accent-color:#e59448}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.column{min-width:0}.column h3{text-align:center;font-size:28px;margin:8px 0}.cell{display:flex;align-items:center;gap:5px;min-height:46px;margin:4px 0;padding:6px;border:1px solid #62452f;border-radius:7px;color:#c4a68c;font-size:12px;overflow-wrap:anywhere}.cell span{font-size:20px;flex:none}.cell.called{background:#5a3920;border-color:#f4b45e;color:#fff4df;font-weight:bold}.cell.latest{outline:2px solid #ffe1a4}.history{display:flex;flex-wrap:wrap;gap:7px}.history div{background:#493020;border-radius:8px;padding:8px 10px}.rolling .picture{animation:shake .12s alternate infinite}@keyframes shake{to{transform:rotate(12deg) scale(.95)}}@media(max-width:560px){main{padding:10px}.cell{flex-direction:column;text-align:center;min-height:65px;padding:3px;font-size:10px;justify-content:center}.cell span{font-size:22px}.current{min-height:240px}}@media(prefers-reduced-motion:reduce){.rolling .picture{animation:none}}
.photo-icon{display:inline-block;flex:none;background-image:var(--bingo-sprite,url("./bingo-pictures.jpg"));background-size:500% 500%;background-repeat:no-repeat;border-radius:7px;width:34px;aspect-ratio:9/8;vertical-align:middle}.picture .photo-icon{width:min(260px,65vw);border-radius:15px}.history .photo-icon{width:36px;margin:0 5px}.cell .photo-icon{width:30px}.photo-picker{font-size:14px;margin:12px 0;color:#e6c5a2}.photo-picker input{max-width:100%}
/* Compact caller, with the game controls kept above the fold. */
body{background:#211711}
main{max-width:880px;padding:14px clamp(10px,3vw,24px) 24px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.topline a{font-size:12px;text-decoration:none;color:#d9b28a}
.topline h1{font-size:clamp(20px,4vw,32px);line-height:1.15;margin:0;letter-spacing:-.035em}
.current{min-height:0;grid-template-columns: minmax(55px,.55fr) minmax(100px,1fr);grid-template-rows:1fr auto;gap:4px 12px;padding:12px 16px;border-radius:16px;max-width:550px;margin:auto}
.letter{font-size:clamp(48px,13vw,86px);grid-column:1;grid-row:1;align-self:center;max-width:100%;overflow-wrap:anywhere}
.picture{grid-column:2;grid-row:1;line-height:1;display:grid;place-items:center;min-height:100px;font-size:clamp(50px,16vw,110px)}
.picture .photo-icon{width:clamp(100px,38vw,190px);border-radius:10px}
.word{grid-column:1/-1;grid-row:2;font-size:clamp(22px,5vw,34px);line-height:1.2;margin:3px 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:550px;margin:8px auto}
.controls button{min-height:40px;padding:8px;font-size:13px;border-radius:9px}
.controls .roll{grid-column:1/-1;min-width:0;font-size:20px;min-height:48px}
.status{font-size:12px;margin:6px auto 2px;text-align:center}
progress{display:block;height:5px;max-width:550px;margin:0 auto 12px}
h2{font-size:17px;margin:12px 0 7px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#312218;border-radius:10px;margin:10px 0 8px}
.tabs button{font-size:13px;padding:8px;min-height:38px;border:0;background:transparent;color:#dec0a1}
.tabs button[aria-selected=true]{background:#694526;color:#fff4df}
.history{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:5px;max-height:42dvh;overflow:auto}
.history div{display:flex;align-items:center;gap:3px;padding:6px;font-size:12px;border:1px solid #694526;min-height:38px}
.history .photo-icon{width:28px;margin:0 3px}
.history div:first-child{border-color:#f4b45e}
.board{gap:3px}
.column h3{position:sticky;top:0;background:#211711;font-size:20px;margin:0;padding:3px;z-index:1}
.cell{min-height:42px;margin:3px 0;padding:3px;gap:3px;font-size:11px;border-radius:5px}
.cell .photo-icon{width:26px}
.cell:not(.called) .photo-icon{opacity:.55}
.photo-picker{max-width:550px;margin:12px auto 0;font-size:12px;color:#caa782}
.photo-picker summary{cursor:pointer}
[hidden]{display:none!important}
@media(max-width:560px){main{padding:10px}.topline{gap:6px}.topline a{font-size:11px;white-space:nowrap}.current{padding:9px 12px;min-height:0}.cell{min-height:48px;font-size:9px;line-height:1.12;padding:3px 1px}.cell .photo-icon{width:26px}.cell span{font-size:18px}.history{max-height:38dvh}.history div{min-width:0;overflow-wrap:anywhere}}
</style></head><body><main><div class="topline"><h1>🍂 Thanksgiving Bingo</h1><a href="./index.html">← Home</a></div><section class="current" id="current" aria-live="polite"><div class="letter" id="letter">🎲</div><div class="picture" id="picture" aria-hidden="true">🎲</div><div class="word" id="word">Ready to play?</div></section><div class="controls"><button class="roll" id="roll">🎲 Roll the dice</button><button id="undo">Undo last call</button><button id="reset">New game</button></div><p class="status" id="status"></p><progress id="progress" max="120" value="0"></progress><div class="tabs" role="tablist" aria-label="Call views"><button id="historyTab" role="tab" aria-selected="true" aria-controls="history">Called pictures</button><button id="boardTab" role="tab" aria-selected="false" aria-controls="board">Full BINGO board</button></div><div class="history" id="history" role="tabpanel" aria-labelledby="historyTab"></div><div class="board" id="board" role="tabpanel" aria-labelledby="boardTab" hidden></div><details class="photo-picker"><summary>Picture setup</summary><p>If the card artwork is not showing, choose the prepared bingo-pictures.jpg file. It will be saved on this device.</p><input type="file" id="spritePicker" accept="image/jpeg,image/png"><span id="spriteStatus"></span></details></main><script>
const items=[['Acorns','🌰'],['Apple','🍎'],['Apple Basket','🧺🍎'],['Apple Pie','🍎🥧'],['Bonfire','🔥'],['Chicken','🐔'],['Corn','🌽'],['Cornucopia','🌽🍇🍐'],['Drumstick','🍗'],['Fall Tree','🍂🌳'],['Feather Headband','🪶'],['Football','🏈'],['Maple Leaves','🍁'],['Mushroom','🍄'],['Owl','🦉'],['Pilgrim Hat','🎩'],['Pumpkin','🎃'],['Pumpkin Pie','🎃🥧'],['Pumpkin Truck','🛻🎃'],['Scarecrow','🌾🧑‍🌾'],['Sunflower','🌻'],['Turkey','🦃'],['Wheat','🌾'],['Wreath','🍃⭕']];
const letters=[...'BINGO'],colors=['#ff8580','#a8dc80','#f6e0c3','#ffac59','#ffe16d'],pool=letters.flatMap((letter,l)=>items.map(([word,picture],i)=>({id:l*items.length+i,letter,word,picture,color:colors[l]})));
const $=id=>document.getElementById(id),key='thanksgiving-bingo-calls-v1';let calls=[],rolling=false;try{const v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))calls=[...new Set(v.filter(i=>Number.isInteger(i)&&i>=0&&i<pool.length))]}catch{}
const positions=[15,3,21,5,9,7,6,8,14,16,19,22,13,1,0,17,20,24,18,10,2,4,11,23];let photoReady=false;function iconFor(a){const s=document.createElement('span');if(!photoReady){s.textContent=a.picture;return s}const n=positions[a.id%items.length];s.className='photo-icon';s.style.backgroundPosition=(n%5*25)+'% '+(Math.floor(n/5)*25)+'%';s.setAttribute('aria-hidden','true');return s}function loadSprite(src){const im=new Image();im.onload=()=>{document.documentElement.style.setProperty('--bingo-sprite','url("'+src+'")');photoReady=true;$('spriteStatus').textContent=' Pictures ready!';if(!rolling)render()};im.onerror=()=>{$('spriteStatus').textContent=' Choose the prepared picture file.'};im.src=src} $('spritePicker').onchange=()=>{const f=$('spritePicker').files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{localStorage.setItem('bingo-sprite-v1',reader.result)}catch{}loadSprite(reader.result)};reader.readAsDataURL(f)};function show(item){$('letter').textContent=item?.letter||'B';$('letter').style.color=item?.color||'';$('picture').replaceChildren(item?iconFor(item):document.createTextNode('🎲'));$('word').textContent=item?.word||'Ready to play?'}
function selectTab(board){$('history').hidden=board;$('board').hidden=!board;$('historyTab').setAttribute('aria-selected',String(!board));$('boardTab').setAttribute('aria-selected',String(board))}$('historyTab').onclick=()=>selectTab(false);$('boardTab').onclick=()=>selectTab(true);function render(){try{localStorage.setItem(key,JSON.stringify(calls))}catch{}const last=calls.at(-1),seen=new Set(calls);show(pool[last]);$('status').textContent=calls.length+' of '+pool.length+' called · '+(pool.length-calls.length)+' remaining';$('progress').value=calls.length;$('historyTab').textContent='Called ('+calls.length+')';$('roll').disabled=rolling||calls.length===pool.length;$('roll').textContent=calls.length===pool.length?'All called!':'🎲 Roll the dice';$('undo').disabled=rolling||!calls.length;$('reset').disabled=rolling;$('history').replaceChildren(...calls.slice().reverse().map(id=>{const a=pool[id],d=document.createElement('div');d.append(document.createTextNode(a.letter+' · '),iconFor(a),document.createTextNode(' '+a.word));return d}));if(!calls.length)$('history').textContent='No calls yet.';$('board').replaceChildren(...letters.map((letter,l)=>{const col=document.createElement('div');col.className='column';const h=document.createElement('h3');h.textContent=letter;h.style.color=colors[l];col.append(h);for(const a of pool.filter(x=>x.letter===letter)){const d=document.createElement('div');d.className='cell'+(seen.has(a.id)?' called':'')+(last===a.id?' latest':'');const s=iconFor(a);d.append(s,document.createTextNode(a.word));col.append(d)}return col}))}
$('roll').onclick=()=>{if(rolling)return;const remaining=pool.filter(a=>!calls.includes(a.id));if(!remaining.length)return;const pick=()=>remaining[Math.floor(Math.random()*remaining.length)];const chosen=pick();rolling=true;render();$('current').classList.add('rolling');const timer=setInterval(()=>show(pick()),90);setTimeout(()=>{clearInterval(timer);$('current').classList.remove('rolling');calls.push(chosen.id);rolling=false;render()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:650)};
$('undo').onclick=()=>{if(!rolling){calls.pop();render()}};$('reset').onclick=()=>{if(!rolling&&confirm('Clear all calls and start a new game?')){calls=[];render()}};render();let savedSprite;try{savedSprite=localStorage.getItem("bingo-sprite-v1")}catch{}loadSprite(savedSprite||"./bingo-pictures.jpg");
</script></body></html>
