const letters=[...'BINGO'],colors=['#ff8580','#a8dc80','#f6e0c3','#ffac59','#ffe16d'];const pool=letters.flatMap((letter,l)=>items.map(([word,image],i)=>({id:l*items.length+i,letter,word,image,color:colors[l]})));const $=id=>document.getElementById(id),key='thanksgiving-bingo-calls-v1';let calls=[],rolling=false;try{const v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))calls=[...new Set(v.filter(i=>Number.isInteger(i)&&i>=0&&i<pool.length))]}catch{}function img(a){const im=document.createElement('img');im.src=a.image;im.alt='';return im}function show(a){$('letter').textContent=a?.letter||'🎲';$('letter').style.color=a?.color||'';$('picture').replaceChildren(a?img(a):document.createTextNode('🍂'));$('word').textContent=a?.word||'Ready to play?'}function render(){try{localStorage.setItem(key,JSON.stringify(calls))}catch{}const last=calls.at(-1),seen=new Set(calls);show(pool[last]);$('status').textContent=calls.length+' / '+pool.length+' called · '+(pool.length-calls.length)+' remaining';$('progress').value=calls.length;$('roll').disabled=rolling||calls.length===pool.length;$('roll').textContent=calls.length===pool.length?'All called!':'🎲 Roll the dice';$('undo').disabled=rolling||!calls.length;$('reset').disabled=rolling;$('historyTab').textContent='Called ('+calls.length+')';$('history').replaceChildren(...calls.slice().reverse().map(id=>{const a=pool[id],d=document.createElement('div'),b=document.createElement('b');d.className='entry';b.textContent=a.letter;b.style.color=a.color;d.append(b,img(a),document.createTextNode(a.word));return d}));if(!calls.length)$('history').textContent='No calls yet.';$('board').replaceChildren(...letters.map((letter,l)=>{const col=document.createElement('div');col.className='column';const h=document.createElement('h2');h.textContent=letter;h.style.color=colors[l];col.append(h);for(const a of pool.filter(x=>x.letter===letter)){const d=document.createElement('div');d.className='cell'+(seen.has(a.id)?' called':'')+(last===a.id?' latest':'');d.append(img(a),document.createTextNode(a.word));col.append(d)}return col}))}function tab(board){$('board').hidden=!board;$('history').hidden=board;$('boardTab').setAttribute('aria-selected',String(board));$('historyTab').setAttribute('aria-selected',String(!board))}$('historyTab').onclick=()=>tab(false);$('boardTab').onclick=()=>tab(true);$('roll').onclick=()=>{if(rolling)return;const remaining=pool.filter(a=>!calls.includes(a.id));if(!remaining.length)return;const pick=()=>remaining[Math.floor(Math.random()*remaining.length)],chosen=pick();rolling=true;render();$('current').classList.add('rolling');const timer=setInterval(()=>show(pick()),90);setTimeout(()=>{clearInterval(timer);$('current').classList.remove('rolling');calls.push(chosen.id);rolling=false;render()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:550)};$('undo').onclick=()=>{if(!rolling){calls.pop();render()}};$('reset').onclick=()=>{if(!rolling&&confirm('Clear all calls and start a new game?')){calls=[];render()}};render();
